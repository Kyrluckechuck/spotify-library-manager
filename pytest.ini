[tool:pytest]
DJANGO_SETTINGS_MODULE = settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
addopts = 
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --reuse-db
    --nomigrations
markers =
    unit: Unit tests
    integration: Integration tests
    graphql: GraphQL tests
    slow: Slow running tests 