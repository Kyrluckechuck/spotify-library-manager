query GetArtist($id: Int!) {
  artist(id: $id) {
    id
    name
    gid
    tracked
    addedAt
    lastSyncedAt
  }
}

query GetArtists($tracked: Boolean, $first: Int = 20, $after: String, $sortBy: String, $sortDirection: String, $search: String) {
  artists(tracked: $tracked, first: $first, after: $after, sortBy: $sortBy, sortDirection: $sortDirection, search: $search) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      id
      name
      gid
      tracked
      addedAt
      lastSyncedAt
    }
  }
}

query GetAlbums($artistId: Int, $wanted: Boolean, $downloaded: Boolean, $first: Int = 20, $after: String, $sortBy: String, $sortDirection: String, $search: String) {
  albums(artistId: $artistId, wanted: $wanted, downloaded: $downloaded, first: $first, after: $after, sortBy: $sortBy, sortDirection: $sortDirection, search: $search) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      id
      name
      spotifyGid
      totalTracks
      wanted
      downloaded
      albumType
      albumGroup
      artist
      artistId
    }
  }
}

query GetSongs($artistId: Int, $downloaded: Boolean, $unavailable: Boolean, $first: Int = 20, $after: String, $sortBy: String, $sortDirection: String, $search: String) {
  songs(artistId: $artistId, downloaded: $downloaded, unavailable: $unavailable, first: $first, after: $after, sortBy: $sortBy, sortDirection: $sortDirection, search: $search) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      id
      name
      gid
      createdAt
      failedCount
      bitrate
      unavailable
      filePath
      downloaded
      spotifyUri
      artist
    }
  }
}

query GetPlaylists($enabled: Boolean, $first: Int = 20, $after: String, $sortBy: String, $sortDirection: String, $search: String) {
  playlists(enabled: $enabled, first: $first, after: $after, sortBy: $sortBy, sortDirection: $sortDirection, search: $search) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      id
      name
      url
      enabled
      autoTrackArtists
      lastSyncedAt
    }
  }
}

mutation SyncArtist($artistId: Int!) {
  syncArtist(artistId: $artistId) {
    success
    message
    taskId
  }
}

mutation SyncPlaylist($playlistId: Int!) {
  syncPlaylist(playlistId: $playlistId) {
    success
    message
    taskId
  }
}

mutation TrackArtist($artistId: Int!) {
  trackArtist(artistId: $artistId) {
    success
    message
    artist {
      id
      name
      tracked
    }
  }
}

mutation UntrackArtist($artistId: Int!) {
  untrackArtist(artistId: $artistId) {
    success
    message
    artist {
      id
      name
      tracked
    }
  }
}

mutation SetAlbumWanted($albumId: Int!, $wanted: Boolean!) {
  setAlbumWanted(albumId: $albumId, wanted: $wanted) {
    success
    message
    album {
      id
      name
      wanted
    }
  }
}

mutation TogglePlaylist($playlistId: Int!) {
  togglePlaylist(playlistId: $playlistId) {
    success
    message
    playlist {
      id
      name
      enabled
    }
  }
} 